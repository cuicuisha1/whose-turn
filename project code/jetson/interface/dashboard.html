<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Before We Approach · 机器人状态</title>
<style>
:root{color-scheme:dark;font:16px/1.6 system-ui,sans-serif;background:#10191d;color:#e2eceb}*{box-sizing:border-box}
body{max-width:1100px;margin:auto;padding:40px 24px}header{border-bottom:1px solid #3b5054;padding-bottom:24px}
h1{font-size:32px;margin:8px 0}h2{font-size:18px;margin:0 0 16px}p{color:#adc0c3}small{color:#a8c2c3}
.badge{color:#afe3c9;border:1px solid #497461;padding:5px 10px;display:inline-block}.grid{display:grid;grid-template-columns:1.2fr 1fr;gap:24px;margin-top:24px}
section{padding:24px;background:#19292e;border:1px solid #30494e}dl{display:grid;grid-template-columns:1fr 1.4fr;gap:12px}dt{color:#abc0c3}dd{margin:0;overflow-wrap:anywhere}
#field{height:220px;position:relative;background:linear-gradient(90deg,transparent 49.7%,#375158 50%,transparent 50.3%),linear-gradient(transparent 49.7%,#375158 50%,transparent 50.3%);border:1px solid #375158}
#target{display:none;position:absolute;width:22px;height:22px;border:2px solid #e9b874;border-radius:50%;transform:translate(-50%,-50%)}
#caption{min-height:60px;color:#f0d4a8;font-size:22px}pre{white-space:pre-wrap;overflow-wrap:anywhere;color:#b9cbcd;font-size:12px;max-height:250px;overflow:auto}
footer{margin-top:24px;font-size:13px;color:#91aaad}@media(max-width:700px){.grid{grid-template-columns:1fr}body{padding:24px 16px}}
</style>
<header><small>BEFORE WE APPROACH / 机器人运行台</small><h1>感知与交互状态</h1><span class="badge" id="connection">正在连接</span><p id="mode">等待运行状态…</p></header>
<div class="grid"><section><h2>目标位置</h2><div id="field"><span id="target"></span></div><dl><dt>行为状态</dt><dd id="behavior">—</dd><dt>目标距离</dt><dd id="distance">—</dd><dt>感知状态</dt><dd id="perception">—</dd><dt>虚拟云台</dt><dd id="head">—</dd></dl></section>
<section><h2>对话字幕</h2><div id="caption">等待文本事件</div><p>文本输入、规则回复与字幕已连接。麦克风、语音识别和语音播放尚未接入。</p><h2>模块状态</h2><pre id="modules">等待数据</pre></section></div>
<footer>只读开发状态页 · 执行层为虚拟设备 · 四轮仅保留实体结构 · 软件聚焦感知与头部交互</footer>
<script>
const get=id=>document.getElementById(id);let last=0,deadline=0;
function clear(reason){get('connection').textContent=reason;get('target').style.display='none';get('distance').textContent='未知';get('head').textContent='无有效动作';get('caption').textContent='—';get('behavior').textContent='数据不可用';get('perception').textContent=reason}
async function refresh(){const requested=performance.now();try{const response=await fetch('/api/status',{cache:'no-store',signal:AbortSignal.timeout(1200)});if(!response.ok)throw Error(response.status);const s=await response.json();last=performance.now();
if(s.system.status!=='running'){clear(s.system.status);return}
get('connection').textContent='已连接';get('mode').textContent=(s.system.mode==='simulation'?'模拟输入':'真实相机输入')+' · v'+s.system.version+' · 虚拟执行';
get('behavior').textContent=s.behavior.state;get('perception').textContent=s.perception.reason;get('modules').textContent=JSON.stringify({vision:s.modules.vision,arduino:s.modules.arduino,faults:s.faults},null,2);
const t=s.perception.valid?s.perception.target:null;deadline=requested+Math.max(0,s.perception_expires_at-s.served_monotonic_s)*1000;
get('target').style.display=t?'block':'none';if(t){get('target').style.left=t.center_x*100+'%';get('target').style.top=t.center_y*100+'%'}
get('distance').textContent=t&&t.distance_m!==null?t.distance_m.toFixed(2)+' m（相机 Z 深度）':'未知';
get('head').textContent=s.head.pan_deg.toFixed(1)+'° / '+s.head.tilt_deg.toFixed(1)+'°'+(s.head.active?' · 跟踪':' · 静止');get('caption').textContent=s.audio.caption||'等待文本事件';
}catch(e){clear('连接中断')}finally{setTimeout(refresh,200)}}
setInterval(()=>{if(last&&performance.now()-last>1500)clear('状态过期');else if(deadline&&performance.now()>deadline){get('target').style.display='none';get('distance').textContent='未知';get('head').textContent='目标已过期';get('caption').textContent='—'}},100);refresh();
</script></html>
